name: birthday_gift
description: A new Flutter project.
publish_to: 'none'
version: 1.1.1+18

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  get_it: ^8.0.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  flutter_bloc: ^9.0.0
  flutter_contacts: ^1.1.7
  flutter_local_notifications: ^19.4.2
  workmanager: ^0.9.0+3
  flutter_keyboard_visibility: ^6.0.0
  device_info_plus: ^12.1.0
  package_info_plus: ^9.0.0
  webview_flutter: ^4.10.0
  synchronized: ^3.4.0

  # Utils
  url_launcher: ^6.3.1
  collection: ^1.19.0
  shared_preferences: ^2.3.3
  result_type: ^1.0.0
  connectivity_plus: ^7.0.0

  # UI
  syncfusion_flutter_datepicker: ^31.1.21
  syncfusion_flutter_calendar: ^31.1.21
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8
  mask_text_input_formatter: ^2.8.0
  country_picker: ^2.0.24
  lottie: ^3.3.2

  # Firebase
  firebase_core: ^4.1.1
  firebase_analytics: ^12.0.2
  firebase_auth: ^6.1.0
  firebase_crashlytics: ^5.0.2
  cloud_firestore: ^6.0.2

  # Google
  google_sign_in: ^6.1.6
  googleapis_auth: ^1.4.1
  googleapis: ^11.3.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.11

dev_dependencies:
  build_runner: ^2.8.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_icons:
  ios: true
  android: true
  image_path: "assets/icon/ic_launcher.png"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  adaptive_icon_background: "assets/icon/ic_launcher_background.png"

flutter_intl:
  enabled: true

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/png/
    - assets/lottie/

  fonts:
    - family: MyFlutterApp
      fonts:
        - asset: assets/icon/MyFlutterApp.ttf
    - family: SFProText
      fonts:
        - asset: assets/font/SF-Pro-Text-Regular.otf
        - asset: assets/font/SF-Pro-Text-Semibold.otf
          weight: 600
