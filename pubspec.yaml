name: birthday_gift
description: A new Flutter project.
publish_to: 'none'
version: 1.1.0+18

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^7.7.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_bloc: ^9.0.0
  flutter_contacts: ^1.1.9+2
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.5.2
  flutter_keyboard_visibility: ^6.0.0
  device_info_plus: ^11.2.1
  package_info_plus: ^8.1.3
  webview_flutter: ^4.10.0
  synchronized: ^3.3.0+3

  url_launcher: ^6.3.1
  collection: ^1.19.0
  shared_preferences: ^2.3.5
  result_type: ^1.0.0
  connectivity_plus: ^6.1.2

  # UI
  syncfusion_flutter_datepicker: ^28.1.39
  flutter_svg: ^2.0.17
  cupertino_icons: ^1.0.8
  mask_text_input_formatter: ^2.9.0
  country_picker: ^2.0.27
  lottie: ^3.3.1

  # Firebase
  firebase_core: ^3.10.0
  firebase_analytics: ^11.4.0
  firebase_auth: ^5.4.0
  firebase_crashlytics: ^4.3.0
  cloud_firestore: ^5.6.1

  # Google
  google_sign_in: ^6.2.2
  googleapis_auth: ^1.6.0
  googleapis: ^13.2.0
  syncfusion_flutter_calendar: ^28.1.39
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Payment
  purchases_ui_flutter: ^8.4.2

dev_dependencies:
  hive_generator: ^2.0.1
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter_icons:
  ios: true
  android: true
  image_path: "assets/icon/ic_launcher.png"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  adaptive_icon_background: "assets/icon/ic_launcher_background.png"

flutter_intl:
  enabled: true

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/png/
    - assets/lottie/

  fonts:
    - family: MyFlutterApp
      fonts:
        - asset: assets/icon/MyFlutterApp.ttf
    - family: SFProText
      fonts:
        - asset: assets/font/SF-Pro-Text-Regular.otf
        - asset: assets/font/SF-Pro-Text-Semibold.otf
          weight: 600
